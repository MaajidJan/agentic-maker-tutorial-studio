apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: botrix-agentic-tutorial-assistant
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/memory: '2Gi'
        run.googleapis.com/cpu: '2'
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/gen-lang-client-0986160378/botrix-agentic-assistant:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: 2Gi
            cpu: '2'
        env:
        - name: GEMINI_MODEL
          value: "gemini-3.5-flash"
        - name: FIRESTORE_COLLECTION
          value: "botrix_tutorial_jobs"
        - name: USE_FIRESTORE
          value: "true"
